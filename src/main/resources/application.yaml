spring:
  application:
    name: cloud-storage
  datasource:
    url: jdbc:postgresql://localhost:5432/cloud_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  file-storage-path: /app/uploads